name: Build and Push Sandbox

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Sandbox to import"
        type: choice
        default: ""
        options:
          - all
          - amp
          - android
          - app-runner
          - astro
          - base-image
          - claude-code
          - codex
          - chromium
          - cua-xfce
          - docker-in-sandbox
          - expo
          - lightpanda
          - nextjs
          - node
          - node-slim
          - omnigent-host
          - onboarder-nextjs
          - playwright-chromium
          - playwright-firefox
          - py-app
          - ts-app
          - tailscale
          - vite
          - xfce-vnc

env:
  # The sandbox-api image is the only public one: hub templates are built from it by bl push.
  REGISTRY: docker.io
  IMAGE_NAME: baseten/sandbox
  TAG: ${{ github.sha }}
  HUB_ENV: ${{ github.ref_name == 'develop' && 'dev' || 'prod' }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      sandbox-api-changed: ${{ steps.changes.outputs.sandbox-api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          # Compare with everything the push brings, not only its last commit.
          # A new branch has no previous commit: fall back to the parent.
          BASE="${{ github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD^
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sandbox-api=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "sandbox-api=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$BASE" HEAD | grep -q "sandbox-api/"; then
            echo "sandbox-api=true" >> $GITHUB_OUTPUT
          else
            echo "sandbox-api=false" >> $GITHUB_OUTPUT
          fi

  sandbox-api-build:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: needs.check-changes.outputs.sandbox-api-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Sign in to Docker Hub with OIDC
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: baseten
        env:
          DOCKERHUB_OIDC_CONNECTIONID: fd8cfd93-1600-4e23-aca4-2972a3934b13

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./sandbox-api
          file: ./sandbox-api/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ github.ref_name == 'develop' && 'dev' || 'prod' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  sandbox-api:
    needs: [check-changes, sandbox-api-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: needs.check-changes.outputs.sandbox-api-changed == 'true'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Sign in to Docker Hub with OIDC
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: baseten
        env:
          DOCKERHUB_OIDC_CONNECTIONID: fd8cfd93-1600-4e23-aca4-2972a3934b13

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=preview,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
  generate-matrix:
    needs: [check-changes, sandbox-api]
    runs-on: ubuntu-latest
    # Skip automatic main pushes, but allow manual dispatch for a selected sandbox.
    if: always() && (needs.check-changes.result == 'success') && (github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.sandbox != ''))
    outputs:
      sandboxes: ${{ steps.retrieve-sandbox.outputs.sandboxes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve sandbox
        id: retrieve-sandbox
        shell: bash
        run: |
          # Compare with everything the push brings, not only its last commit.
          # A new branch has no previous commit: fall back to the parent.
          BASE="${{ github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD^

          # Get list of all Sandbox directories (scripts/files in hub are ignored)
          all_sandboxes=$(tree -J -d -L 1 hub | jq -c '.[0].contents | map(select(.type == "directory") | .name)')


          if [[ "${{ inputs.sandbox }}" == "all" ]]; then
            echo "Importing all Sandboxes"
            echo "sandboxes=$all_sandboxes" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ ! -z "${{ inputs.sandbox }}" ]]; then
            echo "sandboxes=[\"${{ inputs.sandbox }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # On tag push, build all sandboxes
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Tag push detected, building all Sandboxes"
            echo "sandboxes=$all_sandboxes" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Filter Sandbox based on changes
          changed_sandboxes=()

          # Check if there are changes in sandbox-api
          if git diff --name-only "$BASE" HEAD | grep -q "sandbox-api/"; then
            echo "Changes detected in sandbox-api, including all Sandboxes"
            echo "sandboxes=$all_sandboxes" >> $GITHUB_OUTPUT
            exit 0
          else
            for sandbox in $(echo $all_sandboxes | jq -r '.[]'); do
              if git diff --name-only "$BASE" HEAD | grep -q "hub/${sandbox}/"; then
                changed_sandboxes+=("$sandbox")
              fi
            done
          fi

          # Convert array to JSON array
          if [ ${#changed_sandboxes[@]} -eq 0 ]; then
            echo "No Sandboxes with changes found"
            echo "sandboxes=[]" >> $GITHUB_OUTPUT
          else
            # Create a properly formatted JSON array
            sandboxes_json="["
            for sandbox in "${changed_sandboxes[@]}"; do
              if [ "$sandboxes_json" != "[" ]; then
                sandboxes_json="$sandboxes_json,"
              fi
              sandboxes_json="$sandboxes_json\"$sandbox\""
            done
            sandboxes_json="$sandboxes_json]"
            echo "sandboxes=$sandboxes_json" >> $GITHUB_OUTPUT
          fi

  publish-hub:
    # Builds the hub image from its Dockerfile with the hub builder, in the
    # HUB_WORKSPACE workspace, which registers it as <workspace>/<name>.
    runs-on: ubuntu-latest
    environment: |-
      ${{
        github.ref_name == 'develop' && 'dev'
      || 'prod'
      }}
    env:
      HUB_API_URL: ${{ vars.HUB_API_URL }}
      HUB_ADMIN_USERNAME: ${{ secrets.HUB_ADMIN_USERNAME }}
      HUB_ADMIN_PASSWORD: ${{ secrets.HUB_ADMIN_PASSWORD }}
      HUB_WORKSPACE: ${{ vars.HUB_WORKSPACE }}
    needs: [check-changes, generate-matrix, sandbox-api]
    # Run after sandbox-api is pushed, or when it had nothing to push. Skip automatic main pushes, but allow manual dispatch for a selected sandbox.
    if: always() && (github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.sandbox != '')) && needs.generate-matrix.outputs.sandboxes != '[]' && (needs.sandbox-api.result == 'success' || needs.check-changes.outputs.sandbox-api-changed == 'false')
    strategy:
      fail-fast: false
      matrix:
        sandbox: ${{ fromJson(needs.generate-matrix.outputs.sandboxes )}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check build settings
        env:
          HUB_BUILD_API_KEY: ${{ secrets.HUB_BUILD_API_KEY }}
        run: |
          if [[ -z "$HUB_BUILD_API_KEY" ]]; then
            echo "HUB_BUILD_API_KEY is not set for this environment"
            exit 1
          fi
          if [[ -z "$HUB_WORKSPACE" ]]; then
            echo "The HUB_WORKSPACE variable is not set for this environment"
            exit 1
          fi
      - name: Install CLI and log in
        # Installs the latest published CLI release, or the version input.
        env:
          BL_ENV: ${{ env.HUB_ENV }}
        uses: blaxel-ai/bl-action@de9d043c44da4ba07c4417c5abe0dcbe789524b2
        with:
          workspace: ${{ env.HUB_WORKSPACE }}
          apikey: ${{ secrets.HUB_BUILD_API_KEY }}
          # Pin with the HUB_CLI_VERSION repo variable (e.g. v0.1.124, the first with --tag); latest published release otherwise.
          version: ${{ vars.HUB_CLI_VERSION }}
      - name: Set image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # For tags, strip the 'v' prefix to match semver Docker tag
            VERSION="${{ github.ref_name }}"
            echo "tag=${VERSION#v}" >> $GITHUB_OUTPUT
          else
            # For branches, use branch-sha format
            SHA_SHORT=$(git rev-parse --short ${{ github.sha }})
            echo "tag=${{ github.ref_name }}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi
      - name: Build sandbox image
        env:
          TAG: ${{ steps.image-tag.outputs.tag }}
          SANDBOX_VERSION: ${{ github.ref_name == 'develop' && 'develop' || 'latest' }}
          BL_ENV: ${{ env.HUB_ENV }}
        run: |
          # Dockerfiles copy their files as hub/<name>/..., from the repo root.
          # Upload only that folder, with the Dockerfile at the root of the context.
          CONTEXT=$(mktemp -d)
          mkdir -p "$CONTEXT/hub"
          cp -R "hub/${{ matrix.sandbox }}" "$CONTEXT/hub/"
          cp "hub/${{ matrix.sandbox }}/Dockerfile" "$CONTEXT/Dockerfile"
          echo "SANDBOX_VERSION=$SANDBOX_VERSION" > "$CONTEXT/.env.build"
          cd "$CONTEXT"
          # Hub image tags: Docker charset, 32 characters at most. Keep the end,
          # which holds the commit sha, so long branch names stay unique per commit.
          HUB_TAG=$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9_.-' '-' | rev | cut -c1-32 | rev | sed 's/^[.-]*//')
          # bl push streams the build logs and exits non-zero when the build fails.
          set +e
          bl push -y -w "$HUB_WORKSPACE" -t sandbox -n "${{ matrix.sandbox }}" --tag "$HUB_TAG" --timeout 45m 2>&1 | tee push.log
          status=${PIPESTATUS[0]}
          set -e
          # Tags are immutable: a rerun of the same commit finds its tag already built.
          if [[ $status -ne 0 ]] && grep -q "409" push.log && grep -q "already exists" push.log; then
            echo "::notice::$HUB_WORKSPACE/${{ matrix.sandbox }}:$HUB_TAG already exists, nothing to rebuild"
            exit 0
          fi
          exit $status
      - name: Publish sandbox
        env:
          SANDBOX_NAME: ${{ matrix.sandbox }}
          TAG: latest # We want to display latest in UI, controlplane will automaticly use the latest tag
        run: |
          chmod +x ./scripts/publish-sandbox.sh
          ./scripts/publish-sandbox.sh
