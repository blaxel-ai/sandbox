name: Build and Push Sandbox

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Sandbox to import"
        type: choice
        default: ""
        options:
          - all
          - amp
          - android
          - app-runner
          - astro
          - base-image
          - claude-code
          - codex
          - chromium
          - cua-xfce
          - docker-in-sandbox
          - expo
          - lightpanda
          - nextjs
          - node
          - node-slim
          - omnigent-host
          - onboarder-nextjs
          - playwright-chromium
          - playwright-firefox
          - py-app
          - ts-app
          - tailscale
          - vite
          - xfce-vnc

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: blaxel-ai/sandbox
  TAG: ${{ github.sha }}
  BL_ENV: ${{ github.ref_name == 'develop' && 'dev' || 'prod' }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      sandbox-api-changed: ${{ steps.changes.outputs.sandbox-api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sandbox-api=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "sandbox-api=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD^ HEAD | grep -q "sandbox-api/"; then
            echo "sandbox-api=true" >> $GITHUB_OUTPUT
          else
            echo "sandbox-api=false" >> $GITHUB_OUTPUT
          fi

  sandbox-api-build:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: needs.check-changes.outputs.sandbox-api-changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./sandbox-api
          file: ./sandbox-api/Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ github.ref_name == 'develop' && 'dev' || 'prod' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,scope=linux-amd64,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  sandbox-api-build-arm64:
    needs: check-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: needs.check-changes.outputs.sandbox-api-changed == 'true'
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./sandbox-api
          file: ./sandbox-api/Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ github.ref_name == 'develop' && 'dev' || 'prod' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,scope=linux-arm64,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  sandbox-api:
    needs: [check-changes, sandbox-api-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: needs.check-changes.outputs.sandbox-api-changed == 'true'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=preview,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
  generate-matrix:
    needs: [check-changes, sandbox-api]
    runs-on: ubuntu-latest
    # Skip automatic main pushes, but allow manual dispatch for a selected sandbox.
    if: always() && (needs.check-changes.result == 'success') && (github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.sandbox != ''))
    outputs:
      sandboxes: ${{ steps.retrieve-sandbox.outputs.sandboxes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch last 2 commits to compare changes
      - name: Retrieve sandbox
        id: retrieve-sandbox
        shell: bash
        run: |

          # Get list of all Sandbox directories (scripts/files in hub are ignored)
          all_sandboxes=$(tree -J -d -L 1 hub | jq -c '.[0].contents | map(select(.type == "directory") | .name)')


          if [[ "${{ inputs.sandbox }}" == "all" ]]; then
            echo "Importing all Sandboxes"
            echo "sandboxes=$all_sandboxes" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ ! -z "${{ inputs.sandbox }}" ]]; then
            echo "sandboxes=[\"${{ inputs.sandbox }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # On tag push, build all sandboxes
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Tag push detected, building all Sandboxes"
            echo "sandboxes=$all_sandboxes" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Filter Sandbox based on changes
          changed_sandboxes=()

          # Check if there are changes in sandbox-api
          if git diff --name-only HEAD^ HEAD | grep -q "sandbox-api/"; then
            echo "Changes detected in sandbox-api, including all Sandboxes"
            echo "sandboxes=$all_sandboxes" >> $GITHUB_OUTPUT
            exit 0
          else
            for sandbox in $(echo $all_sandboxes | jq -r '.[]'); do
              if git diff --name-only HEAD^ HEAD | grep -q "hub/${sandbox}"; then
                changed_sandboxes+=("$sandbox")
              fi
            done
          fi

          # Convert array to JSON array
          if [ ${#changed_sandboxes[@]} -eq 0 ]; then
            echo "No Sandboxes with changes found"
            echo "sandboxes=[]" >> $GITHUB_OUTPUT
          else
            # Create a properly formatted JSON array
            sandboxes_json="["
            for sandbox in "${changed_sandboxes[@]}"; do
              if [ "$sandboxes_json" != "[" ]; then
                sandboxes_json="$sandboxes_json,"
              fi
              sandboxes_json="$sandboxes_json\"$sandbox\""
            done
            sandboxes_json="$sandboxes_json]"
            echo "sandboxes=$sandboxes_json" >> $GITHUB_OUTPUT
          fi

  build-ghcr-hub:
    runs-on: ubuntu-latest
    needs:
      - generate-matrix
      - sandbox-api
    # Run after sandbox-api completes (if it runs) or is skipped. Skip automatic main pushes, but allow manual dispatch for a selected sandbox.
    if: always() && (github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.sandbox != '')) && needs.generate-matrix.outputs.sandboxes != '[]' && (needs.sandbox-api.result == 'success' || needs.sandbox-api.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        sandbox: ${{ fromJson(needs.generate-matrix.outputs.sandboxes )}}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.sandbox }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./hub/${{ matrix.sandbox }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SANDBOX_VERSION=${{ startsWith(github.ref, 'refs/tags/') && 'latest' || github.ref_name == 'develop' && 'develop' || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-blaxel-hub:
    # Builds the mk3 image with the in-sandbox builder: bl push imports the ghcr
    # image into the blaxel workspace, which registers it as blaxel/<name>.
    runs-on: ubuntu-latest
    environment: |-
      ${{
        github.ref_name == 'develop' && 'dev'
      || 'prod'
      }}
    env:
      BL_API_URL: ${{ vars.BL_API_URL }}
      BL_ADMIN_USERNAME: ${{ secrets.BL_ADMIN_USERNAME }}
      BL_ADMIN_PASSWORD: ${{ secrets.BL_ADMIN_PASSWORD }}
    needs: [generate-matrix, build-ghcr-hub]
    # Skip automatic main pushes, but allow manual dispatch for a selected sandbox.
    if: always() && (github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.sandbox != '')) && needs.generate-matrix.outputs.sandboxes != '[]' && needs.build-ghcr-hub.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        sandbox: ${{ fromJson(needs.generate-matrix.outputs.sandboxes )}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check build key
        env:
          BL_API_KEY: ${{ secrets.BL_BUILD_API_KEY }}
        run: |
          if [[ -z "$BL_API_KEY" ]]; then
            echo "BL_BUILD_API_KEY is not set for this environment"
            exit 1
          fi
      - name: Install Blaxel CLI and log in
        # main at the merge of https://github.com/blaxel-ai/bl-action/pull/14: installs the
        # latest published CLI release, version input. The v1 tag predates it.
        uses: blaxel-ai/bl-action@de9d043c44da4ba07c4417c5abe0dcbe789524b2
        with:
          workspace: blaxel
          apikey: ${{ secrets.BL_BUILD_API_KEY }}
          # Pin with the BL_CLI_VERSION repo variable (e.g. v0.1.124, the first with --tag); latest published release otherwise.
          version: ${{ vars.BL_CLI_VERSION }}
      - name: Set image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # For tags, strip the 'v' prefix to match semver Docker tag
            VERSION="${{ github.ref_name }}"
            echo "tag=${VERSION#v}" >> $GITHUB_OUTPUT
          else
            # For branches, use branch-sha format
            SHA_SHORT=$(git rev-parse --short ${{ github.sha }})
            echo "tag=${{ github.ref_name }}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi
      - name: Build sandbox image
        env:
          # The ref is unique per commit, so the build is never served from the
          # cache of an older image pushed under a reused tag.
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.sandbox }}:${{ steps.image-tag.outputs.tag }}
          TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          # Blaxel image tags: Docker charset, 32 characters at most. Keep the end,
          # which holds the commit sha, so long branch names stay unique per commit.
          BL_TAG=$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9_.-' '-' | rev | cut -c1-32 | rev | sed 's/^[.-]*//')
          # bl push streams the build logs and exits non-zero when the build fails.
          set +e
          bl push -y -w blaxel -t sandbox -n "${{ matrix.sandbox }}" --image "$IMAGE" --tag "$BL_TAG" --timeout 45m 2>&1 | tee push.log
          status=${PIPESTATUS[0]}
          set -e
          # Tags are immutable: a rerun of the same commit finds its tag already built.
          if [[ $status -ne 0 ]] && grep -q "409" push.log && grep -q "already exists" push.log; then
            echo "::notice::blaxel/${{ matrix.sandbox }}:$BL_TAG already exists, nothing to rebuild"
            exit 0
          fi
          exit $status
      - name: Publish sandbox
        env:
          SANDBOX_NAME: ${{ matrix.sandbox }}
          TAG: latest # We want to display latest in UI, controlplane will automaticly use the latest tag
          BL_ENV: ${{ env.BL_ENV }}
        run: |
          chmod +x ./scripts/publish-sandbox.sh
          ./scripts/publish-sandbox.sh
